# Publishes a Shelf Tag Studio update. When a release is published, the zip attached to it
# (shelftag-github.zip) is unpacked into this repository, which is where the app downloads updates from.
name: Publish update
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency: publish-update
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Unpack the release zip into the repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel /tmp/unz
          for i in 1 2 3 4 5 6; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir /tmp/rel --clobber && break
            echo "Waiting for the zip to finish uploading..."; sleep 10
          done
          ZIP=$(ls /tmp/rel/*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then echo "::error::No .zip is attached to release $TAG. Attach shelftag-github.zip and publish again."; exit 1; fi
          unzip -q -o "$ZIP" -d /tmp/unz
          VJ=$(find /tmp/unz -name version.json -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$VJ" ]; then echo "::error::$(basename "$ZIP") has no version.json. Attach shelftag-github.zip."; exit 1; fi
          SRC=$(dirname "$VJ")
          VER=$(jq -r .version "$VJ")
          if [ "v$VER" != "$TAG" ] && [ "$VER" != "$TAG" ]; then echo "::warning::The zip is version $VER but the release is $TAG."; fi
          (cd "$SRC" && tar --exclude=./.git --exclude=./.github -cf - .) | tar -xf -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Shelf Tag Studio $VER"
          git push origin HEAD:main
          echo "Published version $VER"
